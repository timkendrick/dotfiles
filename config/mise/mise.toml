[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]

[settings.node]
corepack = true

[settings.pipx]
uvx = true

[settings.python]
uv_venv_auto = true
