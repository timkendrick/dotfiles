[env]
MISE_SKILL_AGENTS = "claude-code,codex"

[plugins]
duckdb = "https://github.com/timkendrick/mise-duckdb#v0.1.0"
herdr = "https://github.com/timkendrick/mise-herdr#v0.1.0"
skill = "https://github.com/timkendrick/mise-skill#v0.1.0"

[tools]
argo = "latest"
ast-grep = "latest"
awscli = { version = "latest", symlink_bins = "true" }
bat = "latest"
biome = "latest"
bun = "latest"
cargo-binstall = "latest"
claude-code = "latest"
cloc = { version = "latest", bin = "cloc", platforms = { linux-arm64 = { asset_pattern = "cloc-{{ version }}.pl" }, linux-x64 = { asset_pattern = "cloc-{{ version }}.pl" }, macos-arm64 = { asset_pattern = "cloc-{{ version }}.pl" }, macos-x64 = { asset_pattern = "cloc-{{ version }}.pl" }, windows-x64 = { asset_pattern = "cloc-{{ version }}.exe" } } }
dotnet = "latest"
fd = "latest"
fzf = "latest"
go = "latest"
helm = "3.18.4"
hunk = "latest"
java = "21"
jj = "latest"
jjui = "latest"
jq = "latest"
k9s = "latest"
kubectl = "latest"
kustomize = "latest"
lazygit = "latest"
mr-boxington = { version = "latest", workflow = "release.yml@refs/heads/main" }
neovim = "latest"
node = "24"
pandoc = "latest"
pipx = "latest"
python = "3.12"
ripgrep = "latest"
ruff = "latest"
rust = { version = "latest", components = ["rust-analyzer"], mr_boxington = true }
shellcheck = "latest"
television = "latest"
terraform = "latest"
terraform-ls = "latest"
tmux = "latest"
tree-sitter = "latest"
ty = "latest"
uv = "latest"
watchexec = "latest"
"aqua:docker/cli" = "latest"
"aqua:duckdb/duckdb" = "latest"
"aqua:herdrdev/herdr" = "latest"
"cargo:convfmt" = "latest"
"cargo:nail-parquet" = "latest"
"cargo:stu" = "latest"
"duckdb:avro" = "latest"
"duckdb:aws" = "latest"
"duckdb:azure" = "latest"
"duckdb:ducklake" = "latest"
"duckdb:httpfs" = "latest"
"duckdb:postgres_scanner" = "latest"
"duckdb:spatial" = "latest"
"github:backnotprop/plannotator" = "latest"
"github:docker/buildx" = { version = "latest", bin = "docker-buildx" }
"github:docker/compose" = "latest"
"github:microsoft/go-sqlcmd" = "latest"
"github:RivoLink/leaf" = "latest"
"go:github.com/dolmen-go/docker-list-context" = "latest"
"herdr:beyondlex/herdr-recent-navigator" = { version = "latest", depends = ["rust"] }
"herdr:qu8n/herdr-automatic-rename" = "latest"
"herdr:jhochenbaum/herdr-hunk-diff" = { version = "latest", depends = ["node"] }
"herdr:JanTvrdik/herdr-command-palette" = "latest"
"herdr:mroth/herdr-jj-status" = "latest"
"herdr:osamahbeig/herdr-pane-mover" = "latest"
"herdr:iurysza/termscope" = { version = "latest", depends = ["television"] }
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@juicesharp/rpiv-ask-user-question" = "latest"
"npm:@narumitw/pi-caffeinate" = "latest"
"npm:@narumitw/pi-lsp" = "latest"
"npm:@tintinweb/pi-tasks" = "latest"
"npm:@upstash/context7-pi" = "latest"
"npm:bash-language-server" = "latest"
"npm:pi-compact-transcript" = "latest"
"npm:pi-goal-x" = "latest"
"npm:pi-herdr-agents" = "latest"
"npm:pi-powerline-footer" = "latest"
"npm:pi-system-prompt" = "latest"
"npm:pi-web-search" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:yaml-language-server" = "latest"
"pipx:huggingface_hub" = "latest"
"skill:rodbv/socratic-skills" = { version = "ref:main", skills = ["guide-me", "quiz-me"] }

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]

[settings.node]
corepack = true

[settings.pipx]
uvx = true

[settings.python]
uv_venv_auto = true
