onboarding = false

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "system"

[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "workspace",
  ],
  [
    "branch",
    "git_status",
  ],
  [
    "$jj_bookmark",
    "$jj_status",
  ],
]

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-workspaces"
description = "Open Navigator: Workspace"

[[keys.command]]
key = "prefix+ctrl+j"
type = "plugin_action"
command = "mroth.jj-status.refresh"
description = "refresh jj status"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "jt.command-palette.open"
description = "Command palette"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "osamahbeig.pane-mover.open"
description = "move this pane"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "tv | tr -d '\\n' | pbcopy"
description = "Copy file path from current working directory"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+j"
type = "popup"
command = "jjui"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "k9s --namespace $(kubectl get namespace --output=name | sed 's/^namespace\\///' | fzf --header 'Select a namespace')"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "HERDR_ACTIVE_PANE_SHELL_PID=\"$(herdr pane process-info --pane $HERDR_ACTIVE_PANE_ID | jq --raw-output '.result.process_info.shell_pid')\" && btop --filter '!^'$HERDR_ACTIVE_PANE_SHELL_PID'$'"
description = "Show current tab process tree"
width = "80%"
height = "80%"

[keys]
copy_mode = "prefix+v"
goto = "prefix+/"
new_workspace = "prefix+shift+a"
rename_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+d"
new_tab = "prefix+a"
rename_tab = "prefix+c"
previous_tab = "prefix+["
next_tab = "prefix+]"
move_tab_previous = "prefix+shift+["
move_tab_next = "prefix+shift+]"
close_tab = "prefix+d"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "ctrl+h"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = "ctrl+l"
